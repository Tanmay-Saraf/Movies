<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <!-- SideBar -->
     <aside class="sidebar" id="sidebar">
        <div class="logo" id="logo">
            <div class="side-row">
                <span class="nav-row-logo"><i class="fa-solid fa-circle-play"></i></span>
                <span class="nav-row-text">MoviesNow</span>
            </div>
        </div>
        <nav class="nav-section">
            <p class="nav-section-label">Discover</p>
            <button class="nav-row">
                <span class="nav-row-logo"><i class="fas fa-house-chimney"></i></span>
                <span class="nav-row-text">Home</span>
            </button>
            <button class="nav-row">
                <span class="nav-row-logo"><i class="fas fa-clapperboard"></i></span>
                <span class="nav-row-text">Films</span>
            </button>
            <button class="nav-row">
                <span class="nav-row-logo"><i class="fas fa-tv"></i></span>
                <span class="nav-row-text">Series</span>
            </button>
        </nav>
        <nav class="nav-section">
            <p class="nav-section-label">Library</p>
            <button class="nav-row">
                <span class="nav-row-icon"><i class="fas fa-bookmark"></i></span>
                <span class="nav-row-text">Saved</span>
            </button>
        </nav>

        <div class="sidebar-foot">
            <button class="nav-row" id="search-btn">
                <span class="nav-row-logo"><i class="fas fa-magnifying-glass"></i></span>
                <span class="nav-row-text">Search</span>
            </button>
            <button class="nav-row" id="profile-btn">
                <span class="nav-row-logo"><i class="fas fa-circle-user"></i></span>
                <span class="nav-row-text">Account</span>
            </button>
        </div>
     </aside>
     <!-- Content -->
     <main class="main" id="main">
        <!-- Mobile -->
        <header class="topbar" id="topbar">
            <div class="logo" id="logo">
                <div class="side-row">
                    <span class="nav-row-logo"><i class="fa-solid fa-circle-play"></i></span>
                    <span class="nav-row-text">MoviesNow</span>
                </div>
            </div>
            <div class="topbar-right">
                <button class="mob-top" id="searchbtnMob">
                    <i class="fas fa-magnifying-glass"></i>
                </button>
                <button class="mob-top" id="profilebtnMob">
                    <i class="fas fa-circle-user"></i>
                </button>
            </div>
        </header>
        <section class="hero" id="hero">
            <div class="hero-img" id="hero-img"></div>
            <div class="hero-shade"></div>

            <div class="hero-content">
                <div class="hero-upper">
                    <span id="heroUpper">Trending Now</span>
                </div>
                <h1 class="hero-title" id="heroTitle">ABC</h1>
                <p class="hero-tagline" id="hero-tagline">abcdefghijk</p>
                <div class="hero-lower" id="heroLower"></div>
                <div class="hero-actions">
                    <button class="btn-info" id="hero-info">
                        <i class="fas fa-circle-info"></i>
                        <span>More Info</span>
                    </button>
                    <button class="btn-icon" id="heroFav">
                        <i class="far fa-bookmark"></i>
                    </button>
                </div>
            </div>

            <div class="hero-score" id="heroScore" hidden>
                <i class="fas fa-star"></i>
                <span id="heroScoreVal"></span>
            </div>
        </section>
     </main>
</body>
</html>
